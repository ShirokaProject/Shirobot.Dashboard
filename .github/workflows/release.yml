name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build dist and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        run: node -e "if (require('./package.json').version !== process.env.GITHUB_REF_NAME.replace(/^v/, '')) throw new Error('Tag and package version must match')"

      - name: Test uploads
        run: npm test

      - name: Verify release ZIP tooling
        run: python3 -m unittest discover -s scripts -p test_release_zip.py -v

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Verify repeatable build
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/dashboard-first-build"
          cp -R dist "$baseline"
          npm run build
          diff -r "$baseline" dist

      - name: Package dist
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          archive="shirobot-dashboard-${version}.zip"

          python3 scripts/release_zip.py --root dist --output "$GITHUB_WORKSPACE/$archive"

          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true
