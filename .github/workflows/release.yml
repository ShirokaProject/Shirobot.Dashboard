name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build dist and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Package dist
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          archive="shirobot-dashboard-${version}.zip"

          (cd dist && zip -9 -r "$GITHUB_WORKSPACE/$archive" .)
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"

          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          fail_on_unmatched_files: true
