name: Deploy to GitHub Pages

# A public build of the dashboard: it is not served by a Shirobot host, so it runs in
# custom-backend mode (the user adds the address of their own Shirobot on the login page).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # '' with a custom domain (served from the root), '/<repo>' on github.io
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_ENABLE_BACKEND_SWITCH: 'true'
        run: npm run build

      - name: Add SPA fallback
        # Pages has no rewrite rules: unknown paths are served 404.html, which is the app itself
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
